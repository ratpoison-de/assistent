<!doctype html>
<html lang="de">
<head>
<script src="platform.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Start</title>
<link rel="stylesheet" href="design.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-size:16px;line-height:1.4;overscroll-behavior-y:contain;background:#ECECEF;color:#151518}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.hidden{display:none!important}
svg{display:block}
.press{border:2px solid #151518;box-shadow:3px 3px 0 #151518;transition:transform .08s,box-shadow .08s}
.press:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #151518}

/* Kopf */
.top{padding:14px 16px 0}
.r1{display:flex;align-items:center;gap:10px}
.sq{width:46px;height:46px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:none;color:#151518}
.sp{flex:1}
.r2{display:flex;align-items:center;gap:12px;margin-top:16px}
.r2 .t{flex:1;min-width:0}
.greet{margin:0;font-size:33px;line-height:1.04;font-weight:800;letter-spacing:-.035em}
.sub{color:#5E5E66;font-size:15px;margin-top:8px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.clock{width:78px;height:78px;flex:none;border-radius:50%;border:2px solid #151518;box-shadow:3px 3px 0 #151518;background:#fff}
.content{padding:16px 16px 30px}

/* Schnell eintragen */
.qa{display:flex;gap:12px;align-items:stretch}
.qa label{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:0 14px;height:58px}
.qa .hash{font-weight:800;font-size:20px}
.qa input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:16px;color:#151518;font-family:var(--font)}
.qa input::placeholder{color:#8E8E96}
.qa .when{font-size:12.5px;font-weight:800;border:2px solid #151518;border-radius:7px;padding:3px 7px;background:#F2F2F4;flex:none}
.qa .plus{width:58px;height:58px;border-radius:12px;background:#F5C518;display:grid;place-items:center;flex:none}

/* Hinweis */
.alert{display:flex;align-items:center;gap:14px;width:100%;margin-top:16px;padding:14px;border-radius:12px;background:#DDF2E6}
.alert .bell{width:50px;height:50px;border-radius:10px;background:#22B573;border:2px solid #151518;display:grid;place-items:center;flex:none}
.alert .tx{flex:1;min-width:0}
.alert b{display:block;font-size:17px;font-weight:800;line-height:1.25}
.alert small{display:block;font-size:14px;color:#3A3A40;font-weight:600;margin-top:2px}

/* Ordner */
.secT{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:26px 2px 10px}
.folders{display:grid;grid-template-columns:1fr 1fr;gap:16px 16px}
.fold{position:relative;padding-top:15px;display:block;width:100%}
.fold .tb{position:absolute;top:0;left:12px;width:52%;height:24px;background:var(--c);border:2px solid #151518;border-bottom:0;border-radius:9px 9px 0 0}
.fold .fb{position:relative;display:block;background:#fff;border:2px solid #151518;border-radius:6px 12px 12px 12px;box-shadow:4px 4px 0 #151518;padding:12px;min-height:124px;transition:transform .08s,box-shadow .08s}
.fold:active .fb{transform:translate(2px,2px);box-shadow:2px 2px 0 #151518}
.fold .fi{width:46px;height:46px;background:var(--c);border:2px solid #151518;border-radius:8px;display:grid;place-items:center;box-shadow:2px 2px 0 #151518}
.fold .fm{position:absolute;left:70px;right:8px;top:12px;font-size:12.5px;color:#5E5E66;line-height:1.5;font-weight:600}
.fold .fm .d-tag{margin-left:4px}
.fold b{display:block;font-size:17px;font-weight:800;margin-top:22px;line-height:1.2;word-wrap:break-word}

/* Heute-Liste */
.box{background:#fff;border:2px solid #151518;border-radius:12px;box-shadow:4px 4px 0 #151518;padding:14px 16px 6px}
.sec-h{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.sec-h .t{flex:1;min-width:0}
.sec-h h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em}
.sec-h small{display:block;color:#5E5E66;font-size:14px;margin-top:1px;font-weight:600}
.gauge{display:flex;align-items:center;gap:6px;flex:none;font-weight:800;font-size:15px}
.gauge svg{width:58px;height:38px}
.task{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1.5px solid #E2E2E7}
.task:last-of-type{border-bottom:0}
.ck{width:28px;height:28px;border-radius:7px;border:2px solid #151518;flex:none;display:grid;place-items:center;background:#fff;transition:background .15s}
.task.done .ck{background:#22B573}
.task.pop .ck{animation:pop .3s ease}
@keyframes pop{50%{transform:scale(1.2)}}
.task .tx{flex:1;min-width:0}
.task .tx b{display:block;font-size:16.5px;font-weight:700;word-wrap:break-word;line-height:1.3}
.task .tx span{display:block;font-size:13.5px;color:#5E5E66;margin-top:1px}
.task.done .tx b{color:#8E8E96;text-decoration:line-through}
.add{display:flex;align-items:center;gap:14px;padding:12px 0;font-weight:800;width:100%;border-top:1.5px solid #E2E2E7}
.add i{width:28px;height:28px;border-radius:7px;border:2px dashed #151518;display:grid;place-items:center;font-style:normal;font-size:19px;line-height:1}
.note{color:#5E5E66;font-size:14.5px;padding:8px 0}

/* Karten */
.cards{display:flex;flex-direction:column;gap:16px;margin-top:18px}
.card{background:#fff;border:2px solid #151518;border-radius:12px;box-shadow:4px 4px 0 #151518;padding:14px 16px;width:100%;display:block}
button.card:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #151518}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ci{width:36px;height:36px;border-radius:8px;background:var(--c,#F5C518);border:2px solid #151518;color:#151518;display:grid;place-items:center;flex:none}
.ch h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.015em;flex:1}
.ch .go{font-weight:800;font-size:13.5px;flex:none;text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:4px;background:#F5C518;color:#151518;font-weight:800;font-size:12px;padding:2px 7px;border-radius:5px;border:1.5px solid #151518;white-space:nowrap}
.sumtxt{font-size:16px;line-height:1.5}
.sumtxt b{font-weight:800;background:linear-gradient(transparent 62%,#F5C518 62%)}
.wxrow{display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1.5px solid #E2E2E7}
.wxrow .ic{width:50px;height:50px;flex:none}
.wxrow .tp{font-size:32px;font-weight:800;letter-spacing:-.04em;line-height:1}
.wxrow .tx{font-size:13.5px;color:#5E5E66;line-height:1.35}
.wxrow .tx b{display:block;font-size:15px;color:#151518}
.hint{margin-top:10px;background:#FFF1B8;border:2px solid #151518;border-radius:9px;padding:8px 11px;font-size:13.5px;font-weight:700}
.hint+.hint{margin-top:6px}
.next{display:flex;gap:14px;align-items:center}
.next .when{flex:none;text-align:center;background:#F5C518;border:2px solid #151518;border-radius:10px;padding:9px 12px;min-width:74px;box-shadow:2px 2px 0 #151518}
.next .when b{display:block;font-size:20px;font-weight:800;line-height:1.1}
.next .when small{font-size:11.5px;font-weight:800}
.next .w{min-width:0}
.next .w b{display:block;font-size:17px;font-weight:800;line-height:1.25;word-wrap:break-word}
.next .w span{display:block;color:#5E5E66;font-size:13.5px;margin-top:2px}
.ev{display:flex;gap:12px;align-items:stretch;padding:9px 0;border-top:1.5px solid #E2E2E7}
.ev:first-of-type{border-top:0;padding-top:2px}
.ev .tm{width:50px;flex:none;font-weight:800;font-size:13.5px;line-height:1.3}
.ev .tm small{display:block;color:#5E5E66;font-weight:600;font-size:12px}
.ev .bar{width:6px;border-radius:2px;flex:none;border:1.5px solid #151518}
.ev .tt{min-width:0;flex:1}
.ev .tt b{display:block;font-weight:700;font-size:15px;word-wrap:break-word}
.ev .tt span{display:block;color:#5E5E66;font-size:12.5px}
.ev.past{opacity:.45}
.mrow{display:flex;gap:11px;align-items:center;padding:8px 0;border-top:1.5px solid #E2E2E7;width:100%}
.mrow:first-of-type{border-top:0;padding-top:2px}
.av{width:36px;height:36px;border-radius:8px;border:2px solid #151518;display:grid;place-items:center;color:#151518;font-weight:800;flex:none;font-size:14px}
.mrow .mt{min-width:0;flex:1}
.mrow .mt b{display:block;font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .mt span{display:block;font-size:13.5px;color:#5E5E66;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1}
.mailhead{display:flex;align-items:flex-end;gap:10px;margin-bottom:10px}
.mailhead span{color:#5E5E66;font-size:14px;font-weight:600;padding-bottom:4px}
.btns{display:flex;gap:10px;margin-top:12px}
.btns .d-btn{flex:1;padding:11px 10px;font-size:14px}
.empty{color:#5E5E66;font-size:14.5px}
.ban{border:2px solid #151518;border-radius:9px;padding:7px 11px;font-size:13.5px;font-weight:700;margin-bottom:10px}
.ban.fer{background:#DDF2E6}
.ban.hol{background:#FFE1E1}
.pin{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1.5px solid #E2E2E7;width:100%}
.pin:first-of-type{border-top:0;padding-top:2px}
.pin .e{font-size:20px;width:28px;text-align:center;flex:none}
.pin .pt{min-width:0;flex:1}
.pin .pt b{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin .pt span{display:block;font-size:12.5px;color:#5E5E66}
.skel{height:14px;border-radius:4px;background:linear-gradient(90deg,#E2E2E7,#F2F2F4,#E2E2E7);background-size:200% 100%;animation:sk 1.2s infinite;margin:8px 0}
@keyframes sk{to{background-position:-200% 0}}
.foot{text-align:center;color:#5E5E66;font-size:12.5px;margin:26px 0 4px;line-height:1.5}
.burst{position:fixed;z-index:90;pointer-events:none;font-weight:800;font-size:14.5px;background:#F5C518;border:2px solid #151518;border-radius:8px;padding:4px 10px;box-shadow:2px 2px 0 #151518;animation:up 1s ease forwards}
@keyframes up{0%{opacity:0;transform:translate(-50%,6px)}20%{opacity:1;transform:translate(-50%,-6px)}100%{opacity:0;transform:translate(-50%,-30px)}}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;background:#ECECEF;border-top:2px solid #151518;border-radius:18px 18px 0 0;padding:8px 16px 26px;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:#151518;margin:0 auto 14px;opacity:.3}
.field{width:100%;padding:13px 14px;border-radius:10px;border:2px solid #151518;box-shadow:3px 3px 0 #151518;background:#fff;font-size:16.5px;outline:none;margin:6px 0 14px;font-family:var(--font);color:#151518}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;background:#fff;border:2px solid #151518;box-shadow:3px 3px 0 #151518;border-radius:12px;margin-bottom:10px;width:100%}
.opt span{flex:1}
.opt b{font-weight:800;display:block}
.opt small{color:#5E5E66;font-size:13px;display:block}
.sw{width:48px;height:28px;border-radius:14px;background:#DADADF;border:2px solid #151518;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;left:1px;top:1px;width:20px;height:20px;border-radius:10px;background:#fff;border:2px solid #151518;transition:transform .2s}
.sw.on{background:#22B573}.sw.on::after{transform:translateX(20px)}
.lbl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#5E5E66;margin:12px 4px 4px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}

.greet{font-size:30px;line-height:1.08;text-transform:uppercase;color:#FF3B30;font-weight:800;letter-spacing:-.005em}

.sub{color:#8E8E93}
.sub .d-tag{background:#FFF3C4;color:#9A6B00}

.alert small{color:#8A6D00}
.secT{text-transform:uppercase;font-size:17px;font-weight:800;color:#1C1C1E;margin-top:24px}
.fold .fb,.fold:first-child .fb{background:#F2F2F7;color:#1C1C1E;border:0;box-shadow:none;border-radius:14px;min-height:104px;padding:12px}
.fold .fi,.fold:first-child .fi{--k:#FF3B30;width:34px;height:34px;border-radius:50%;background:var(--k);box-shadow:none}
.fold:nth-child(2) .fi{--k:#007AFF}.fold:nth-child(3) .fi{--k:#FFCC00}.fold:nth-child(4) .fi{--k:#FF9500}.fold:nth-child(5) .fi{--k:#5AC8FA}.fold:nth-child(6) .fi{--k:#8E8E93}
.fold .fi svg{width:18px;height:18px}
.fold .fi svg *{stroke:#fff}
.fold .fm,.fold:first-child .fm{left:56px;top:13px;color:#8E8E93;font-weight:500}
.fold .d-tag,.fold:first-child .d-tag{background:#FF3B30;color:#fff}
.fold b{font-weight:700;color:#3A3A3C;margin-top:18px;font-size:16px}
.fold .fb,.fold:first-child .fb{display:grid;grid-template-columns:34px minmax(0,1fr);grid-template-areas:"i m" "n n";column-gap:10px;row-gap:14px;align-content:space-between;min-height:104px}
.fold .fi,.fold:first-child .fi{grid-area:i;align-self:start}
.fold .fm,.fold:first-child .fm{grid-area:m;position:static;left:auto;top:auto;right:auto;align-self:center;font-size:12.5px;line-height:1.35;overflow-wrap:anywhere;min-width:0}
.fold .fm .d-tag{margin-left:4px;vertical-align:1px;white-space:nowrap}
.fold b{grid-area:n;margin:0;align-self:end;line-height:1.2}

.fold .fb,.fold:first-child .fb{flex:1;width:100%}
.box,.card{background:#fff;border:0;border-top:.5px solid #DCDCE0;box-shadow:none;border-radius:0;padding:16px 2px 8px}
.sec-h h2,.ch h3{text-transform:uppercase;font-weight:800;font-size:16px;color:#1C1C1E;letter-spacing:0}

.add{color:#FF3B30;border-top:.5px solid #DCDCE0}

<script>
(function(){

  check:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>'

/* ================= Tageszeit ================= */
let NAME='Thorsten';try{NAME=localStorage.getItem('planer.name')||NAME}catch(e){}
function part(h){return h<5?'nacht':h<11?'morgen':h<17?'tag':h<22?'abend':'nacht'}
const GREET={morgen:'Guten Morgen',tag:'Guten Tag',abend:'Guten Abend',nacht:'Gute Nacht'};
const PHASE={morgen:['Morgen','Der Morgen läuft bis 11:00 Uhr',11],tag:['Tag','Der Tag läuft bis 17:00 Uhr',17],abend:['Abend','Der Abend läuft bis 22:00 Uhr',22],nacht:['Nacht','Zeit zum Abschalten – bis morgen früh',null]};

/* ================= Landschaft ================= */
function weather(){try{const w=JSON.parse(localStorage.getItem('planer.weather')||'null');if(w&&w.data&&Date.now()-w.t<36*3600000)return w}catch(e){}return null}
function sunTimes(){
  const w=weather(),t=ymd(new Date());
  if(w){const d=w.data.daily;const i=d.time.indexOf(t);if(i>=0&&d.sunrise[i])return{sr:new Date(d.sunrise[i]),ss:new Date(d.sunset[i]),srN:d.sunrise[i+1]?new Date(d.sunrise[i+1]):null}}
  const b=new Date();const sr=new Date(b);sr.setHours(7,15,0,0);const ss=new Date(b);ss.setHours(17,30,0,0);return{sr,ss,srN:null};
}
const PAL={
  morgen:{sky:['#F7D9C4','#F8E3D3'],h:['#F3C2A6','#EBA98C','#DE8E79','#C27280','#934E6E'],sun:'#EE8551',halo:'rgba(255,214,186,.75)',dot:'#D79A86',acc:'#F7C873'},
  tag:   {sky:['#FBE6D5','#FCEEE3'],h:['#F5CBAE','#EEB394','#E39A80','#C97C84','#9A5672'],sun:'#F29A5E',halo:'rgba(255,226,196,.8)',dot:'#DEA996',acc:'#F7C873'},
  abend: {sky:['#F0B394','#F5C9AE'],h:['#E79A7B','#D57D6E','#BE6470','#9A4E68','#6F3858'],sun:'#E8643A',halo:'rgba(255,190,150,.7)',dot:'#C9826F',acc:'#F2A86B'},
  nacht: {sky:['#3A2440','#5B3658'],h:['#6E4262','#5E3756','#4D2D4A','#3D233D','#2F1A30'],sun:'#FBE6C8',halo:'rgba(251,230,200,.18)',dot:'#8C6A86',acc:'#B79AD9'}
};
let palKey='morgen';
function arcPt(f){return{x:40+320*f,y:134-104*Math.sin(Math.PI*f)}}
function landscapeOld(){
  const now=new Date(),st=sunTimes();
  let f=(now-st.sr)/(st.ss-st.sr),up=f>=0&&f<=1;
  palKey=up?(f<0.25?'morgen':f>0.78?'abend':'tag'):'nacht';
  const p=PAL[palKey];
  // Nacht: Mond wandert über den Bogen
  let mf=0.5;if(!up){const ssY=new Date(st.ss);if(f<0)ssY.setDate(ssY.getDate()-1);const srN=f>1?(st.srN||new Date(st.sr.getTime()+864e5)):st.sr;mf=Math.min(1,Math.max(0,(now-ssY)/(srN-ssY)))}
  const pt=arcPt(up?f:mf);
  $('sky').style.background='linear-gradient(180deg,'+p.sky[0]+' 0%,'+p.sky[1]+' 100%)';
  $('sky').classList.toggle('night',palKey==='nacht');
  let s='';
  // Sterne
  if(palKey==='nacht'){const st2=[[30,30],[75,62],[120,22],[170,52],[228,28],[268,70],[320,36],[360,64],[96,100],[300,98],[200,88],[385,20],[15,80]];
    s+=st2.map(([x,y],i)=>'<circle cx="'+x+'" cy="'+y+'" r="'+(i%3?0.9:1.4)+'" fill="#FBEFE6" opacity="'+(i%2?.55:.9)+'"/>').join('')}
  // Bahn
  let d='';for(let i=0;i<=40;i++){const q=arcPt(i/40);d+=(i?'L':'M')+q.x.toFixed(1)+' '+q.y.toFixed(1)}
  s+='<path d="'+d+'" fill="none" stroke="'+p.dot+'" stroke-width="1.6" stroke-dasharray="0.1 6" stroke-linecap="round" opacity=".9"/>';
  // Sonne / Mond
  if(palKey==='nacht')s+='<circle cx="'+pt.x+'" cy="'+pt.y+'" r="30" fill="'+p.halo+'"/><circle cx="'+pt.x+'" cy="'+pt.y+'" r="15" fill="'+p.sun+'"/><circle cx="'+(pt.x+6)+'" cy="'+(pt.y-4)+'" r="13" fill="'+p.sky[0]+'" opacity=".95"/>';
  else s+='<circle cx="'+pt.x+'" cy="'+pt.y+'" r="44" fill="'+p.halo+'"/><circle cx="'+pt.x+'" cy="'+pt.y+'" r="24" fill="'+p.sun+'"/>';
  // Vögel
  if(palKey!=='nacht'){const bx=Math.min(330,Math.max(40,pt.x+(pt.x<200?-30:30))),by=Math.max(28,pt.y-34);
    s+='<g class="bird" stroke="#7A4B4F" stroke-width="1.4" fill="none" stroke-linecap="round"><path d="M'+(bx-34)+' '+(by+22)+'q4 -4 8 0q4 -4 8 0"/><path d="M'+(bx+6)+' '+by+'q3.5 -3.5 7 0q3.5 -3.5 7 0"/><path d="M'+(bx-12)+' '+(by-10)+'q3 -3 6 0q3 -3 6 0"/></g>'}
  // Hügel
  const H=['M0 128 C 70 104,150 116,230 106 S 350 92,400 100 V236 H0Z',
           'M0 150 C 60 136,140 158,220 146 S 340 126,400 136 V236 H0Z',
           'M0 176 C 90 158,170 184,262 170 S 360 156,400 164 V236 H0Z',
           'M0 198 C 100 186,190 206,282 194 S 372 186,400 190 V236 H0Z',
           'M0 218 C 110 208,230 226,400 210 V236 H0Z'];
  H.forEach((h,i)=>{s+='<path d="'+h+'" fill="'+p.h[i]+'"/>';
    if(i===1){ // Windmühle
      s+='<g transform="translate(212 147)"><path d="M-3.4 0 L-2.2 -17 L2.2 -17 L3.4 0Z" fill="'+p.h[3]+'"/><g transform="translate(0 -17)"><g class="blade" fill="'+p.h[3]+'"><rect x="-1" y="-12" width="2" height="12"/><rect x="0" y="-1" width="12" height="2"/><rect x="-1" y="0" width="2" height="12"/><rect x="-12" y="-1" width="12" height="2"/></g><circle r="1.6" fill="'+p.h[4]+'"/></g></g>';
      // Zypressen
      s+='<g fill="'+p.h[3]+'"><ellipse cx="316" cy="124" rx="4.2" ry="13"/><ellipse cx="327" cy="121" rx="4.6" ry="15"/><ellipse cx="338" cy="125" rx="4" ry="12"/></g>';
    }
    if(i===3){ // Häuschen
      s+='<g transform="translate(296 186)" fill="'+p.h[4]+'"><rect x="-7" y="-9" width="14" height="10"/><path d="M-9 -9 L0 -17 L9 -9Z"/></g>';
    }
    if(i===2||i===3){ // Blumen
      const fl=i===2?[[30,176],[78,170],[122,178],[168,182],[340,166],[372,163]]:[[18,199],[52,195],[96,193],[150,198],[206,203],[250,199],[350,192]];
      const cols=palKey==='nacht'?['#8F6A8E','#7B5A7E','#A58AB8']:[p.acc,'#F29B76','#C9A2E0','#FBE3B5'];
      fl.forEach(([x,y],k)=>{s+='<circle cx="'+x+'" cy="'+y+'" r="'+(k%2?1.8:2.3)+'" fill="'+cols[k%cols.length]+'"/>'});
    }
  });
  $('land').innerHTML=s;
  try{P&&P.updateBar&&P.updateBar()}catch(e){}
}
function landscape(){try{P&&P.updateBar&&P.updateBar()}catch(e){}}
window.skyTop=function(){let ep=false;try{ep=epVisible}catch(_){}if(document.documentElement.classList.contains('aqua'))return{color:'#9AC0E7',dark:true,nav:'#5682B9'};if(document.documentElement.classList.contains('glass'))return{color:'#F3F4F6',dark:false,nav:'#DFE2E6'};if(ep||document.documentElement.classList.contains('epaper'))return{color:'#FFFFFF',dark:false,nav:'#FFFFFF'};return{color:document.body.classList.contains('mdopen')?'#9AD6FB':'#86CEFA',dark:false}};

/* ================= Uhr ================= */
(function buildClock(){
  let t='<circle r="49" fill="#FFFFFF"/>';
  for(let i=0;i<60;i++)t+=i%5?'<rect x="-.5" y="-46.5" width="1" height="3.6" fill="#151518" transform="rotate('+i*6+')"/>':'<rect x="-1.6" y="-46.5" width="3.2" height="10" rx=".3" fill="#151518" transform="rotate('+i*6+')"/>';
  t+='<g id="hH"><path d="M-2 8 L-1.3 -27 L1.3 -27 L2 8 Z" fill="#151518"/></g><g id="hM"><path d="M-1.6 10 L-.9 -42.5 L.9 -42.5 L1.6 10 Z" fill="#151518"/></g>';
  t+='<g id="hS"><rect x="-.4" y="-41" width=".8" height="54" fill="#151518"/><rect x="-.9" y="8" width="1.8" height="6.5" rx=".5" fill="#151518"/></g><circle r="1.5" fill="#151518"/><circle r=".55" fill="#fff"/>';
  $('clock').innerHTML=t;
})();
const hH=$('hH'),hM=$('hM'),hS=$('hS');let ticking=true,raf=0;
function clock(){
  const d=new Date(),s=d.getSeconds()+d.getMilliseconds()/1000,m=d.getMinutes(),h=d.getHours()%12;
  hS.setAttribute('transform','rotate('+(s*6)+')');hM.setAttribute('transform','rotate('+(m*6)+')');hH.setAttribute('transform','rotate('+(h*30+m*0.5)+')');
  $('clock').setAttribute('aria-label','Es ist '+d.getHours()+':'+pad(m)+' Uhr');
  if(ticking&&!document.hidden)raf=requestAnimationFrame(clock);else raf=0;
}
function startClock(){ticking=true;if(!raf)raf=requestAnimationFrame(clock)}

/* ================= Daten ================= */
async function from(tab,timeout){
  if(!P||!P.ensure)return null;
  try{const w=await Promise.race([P.ensure(tab),new Promise(r=>setTimeout(()=>r(null),timeout||6000))]);
    if(!w||typeof w.briefing!=='function')return null;
    return await Promise.race([Promise.resolve(w.briefing()),new Promise(r=>setTimeout(()=>r(null),timeout||9000))]);}catch(e){return null}
}
function wxIcon(code,night){try{return P.document.getElementById('f-wetter').contentWindow.weatherIcon(code,night)}catch(e){return''}}
const WTXT={0:'klar',1:'überwiegend klar',2:'teils bewölkt',3:'bedeckt',45:'neblig',48:'neblig',51:'Nieselregen',53:'Nieselregen',55:'Nieselregen',61:'leichter Regen',63:'Regen',65:'starker Regen',71:'leichter Schnee',73:'Schnee',75:'starker Schnee',80:'Schauer',81:'Schauer',82:'heftige Schauer',95:'Gewitter',96:'Gewitter',99:'Gewitter'};
const wtxt=c=>WTXT[c]||'wechselhaft';
const COLORS=['#FF3B30','#FF9500','#FFCC00','#34C759','#5AC8FA','#007AFF','#AF52DE','#8E8E93'];
function colorOf(s){let h=0;for(const c of String(s||''))h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]}
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const toMin=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m};
function until(min){const d=min-nowMin();if(d<=0)return'jetzt';if(d<60)return'in '+d+' Min.';const h=Math.floor(d/60),m=d%60;return'in '+h+' Std.'+(m?' '+m+' Min.':'')}
function plural(n,a,b){return n+' '+(n===1?a:b)}
function joinList(a){a=a.filter(Boolean);if(a.length<2)return a.join('');return a.slice(0,-1).join(', ')+' und '+a[a.length-1]}
function streak(){
  let d=[];try{d=JSON.parse(localStorage.getItem('planer.doneDays')||'[]')}catch(e){}
  const set=new Set(d);const c=new Date();if(!set.has(ymd(c)))c.setDate(c.getDate()-1);
  let n=0;while(set.has(ymd(c))){n++;c.setDate(c.getDate()-1)}return n;
}
let D={};try{const mb=JSON.parse(localStorage.getItem('planer.mailbrief')||'null');if(mb)D.mail=mb}catch(_){}

/* ================= Kopf ================= */
function header(){
  const n=new Date(),p=part(n.getHours());
  $('date').textContent=WDL[n.getDay()]+', '+n.getDate()+'. '+MONS[n.getMonth()];
  $('greet').innerHTML='<span class="hi">'+esc(GREET[p])+',</span><br>'+esc(NAME)+'!';
  const s=streak();$('streak').classList.toggle('hidden',s<2);$('streakN').textContent=s;
  $('streak').title=s+(s===1?' Tag':' Tage')+' in Folge etwas erledigt';
  return p;
}

/* ================= Aufgaben ================= */
function gauge(done,total){
  const f=total?done/total:0;const a0=Math.PI*0.95,a1=Math.PI*0.05;const R=24,cx=31,cy=32;
  const pt=a=>[cx+R*Math.cos(a),cy-R*Math.sin(a)];const ang=a0-(a0-a1)*f;
  const [x0,y0]=pt(a0),[x1,y1]=pt(a1),[xf,yf]=pt(ang);
  return '<svg viewBox="0 0 62 40"><path d="M'+x0.toFixed(1)+' '+y0.toFixed(1)+' A'+R+' '+R+' 0 0 1 '+x1.toFixed(1)+' '+y1.toFixed(1)+'" fill="none" stroke="#EBEDF0" stroke-width="6" stroke-linecap="round"/>'+
    (f>0?'<path d="M'+x0.toFixed(1)+' '+y0.toFixed(1)+' A'+R+' '+R+' 0 0 1 '+xf.toFixed(1)+' '+yf.toFixed(1)+'" fill="none" stroke="#2A82F6" stroke-width="6" stroke-linecap="round"/>':'')+
    '<circle cx="'+xf.toFixed(1)+'" cy="'+yf.toFixed(1)+'" r="5" fill="#fff" stroke="#2A82F6" stroke-width="2.5"/></svg>';
}
function tasksHTML(p){
  const t=D.woche,[name,,endH]=PHASE[p];
  if(t===undefined)return '<div class="sec-h"><div class="t"><h2>'+name+'</h2><small>Lade Aufgaben …</small></div></div><div class="skel" style="width:70%"></div><div class="skel" style="width:50%"></div>';
  if(!t)return '';
  /* Mein Tag in drei Listen: Prioritäten · Routinen · Aufgaben */
  const wk=[...(t.doneList||[]).map(x=>Object.assign({done:true},x)),...t.open.map(x=>Object.assign({done:false},x))];
  const pj=((D.proj&&D.proj.today)||[]);
  const g=greenToday();
  const prio=wk.filter(x=>x.prio),rout=wk.filter(x=>!x.prio&&x.rep),rest=wk.filter(x=>!x.prio&&!x.rep);
  const ord=l=>l.filter(x=>!x.done).concat(l.filter(x=>x.done));
  const open=wk.filter(x=>!x.done).length+pj.filter(x=>!x.done).length+(g.done?0:1);
  const done=wk.filter(x=>x.done).length+pj.filter(x=>x.done).length+(g.done?1:0),total=open+done;

    if(r!=null)out.push('☔ '+(r===now.getHours()?'Gerade':'Ab '+r+' Uhr')+' Regen wahrscheinlich – Schirm einpacken.')}
  else if((day.precipitation_probability_max[1]||0)>=55)out.push('☔ Morgen wird es nass ('+day.precipitation_probability_max[1]+'%) – Schirm bereitlegen.');

  const f=fcLoad();if(!f||Date.now()-f.t>45*60*1000)fcFetch();
  if(!f){el.innerHTML='';return}
  const d=f.d,today=ymd(new Date());let i0=d.time.indexOf(today);if(i0<0)i0=0;
  /* die kommenden 5 Tage: ab morgen */
  const idx=[];for(let i=i0+1;i<d.time.length&&idx.length<5;i++)idx.push(i);
  if(!idx.length){el.innerHTML='';return}
  const lo=Math.min(...idx.map(i=>d.temperature_2m_min[i])),hi=Math.max(...idx.map(i=>d.temperature_2m_max[i])),sp=Math.max(4,hi-lo);
  const cols=idx.map(i=>{const dt=new Date(d.time[i]+'T12:00:00'),mx=d.temperature_2m_max[i],mn=d.temperature_2m_min[i],rp=d.precipitation_probability_max[i];
    const top=(1-(mx-lo)/sp)*100,bot=(mn-lo)/sp*100;
    return '<div class="fcd"><small>'+WD[dt.getDay()]+'</small><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+WXI[wxKind(d.weather_code[i])]+'</svg>'+
      '<b>'+Math.round(mx)+'°</b><span class="fcb"><i style="top:'+top.toFixed(0)+'%;bottom:'+bot.toFixed(0)+'%"></i></span><em>'+Math.round(mn)+'°</em><small class="fcr">'+(rp>=20?rp+'%':'&nbsp;')+'</small></div>'}).join('');
  el.innerHTML='<div class="fch">'+TBB.name+' · 5 Tage</div><div class="fcg">'+cols+'</div>';
  requestAnimationFrame(()=>{try{const c=$('epC');c.style.display='';epFit();if(c.clientHeight<60){c.style.display='none';epFit()}}catch(_){}});
}

/* ================= Begleiter: Morgen, Tag, Abend, Woche ================= */
const CP_KEY='planer.companion',JR_KEY='planer.journal',WT_KEY='planer.waiting',DL_KEY='planer.dayslog';
const jget=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return v==null?d:v}catch(_){return d}};
const jset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}};
function cp(){return Object.assign({d:'',morning:false,evening:false,focus:null,week:'',times:{on:true,m:'06:45',e:'20:30'}},jget(CP_KEY,{}))}
function cpSet(c){jset(CP_KEY,c)}
function cpToday(){const c=cp(),t=ymd(new Date());if(c.d!==t){c.d=t;c.morning=false;c.evening=false;cpSet(c)}return c}
function tomorrowYmd(){const d=new Date();d.setDate(d.getDate()+1);return ymd(d)}
function isoWeek(d){d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-n);const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));return d.getUTCFullYear()+'-W'+String(Math.ceil(((d-y)/864e5+1)/7)).padStart(2,'0')}
/* Erledigtes jeden Tag festhalten (die Woche löscht Erledigtes am Folgetag) */
function logDay(){if(!D.woche)return;const t=ymd(new Date()),l=jget(DL_KEY,{});const done=(D.woche.doneList||[]).map(x=>x.text);
  if(JSON.stringify(l[t]||[])!==JSON.stringify(done)){l[t]=done;const keys=Object.keys(l).sort();while(keys.length>70)delete l[keys.shift()];jset(DL_KEY,l)}}
function daysSince(s){if(!s)return 0;const a=new Date(s+'T12:00:00'),b=new Date();return Math.floor((b-a)/864e5)}
function wxDay(i){const w=weather();if(!w||!w.data||!w.data.daily)return null;const d=w.data.daily;return{code:d.weather_code[i],mx:Math.round(d.temperature_2m_max[i]),mn:Math.round(d.temperature_2m_min[i]),rain:(d.precipitation_probability_max||[])[i]||0}}
function evLine(e){return (e.allDay||!e.tStart?'ganztägig':e.tStart+(e.tEnd?'–'+e.tEnd:''))+' '+e.title}
function minsUntil(t){const [h,m]=t.split(':').map(Number);const n=new Date();return h*60+m-(n.getHours()*60+n.getMinutes())}
const MOODS=['schwer','zäh','okay','gut','richtig gut'];
const moodDots=(n,sel)=>'<span class="mdots">'+[1,2,3,4,5].map(i=>'<i class="'+(i<=n?'on':'')+'"></i>').join('')+'</span>';

/* Welche Karte gerade passt */
function companionState(){
  const c=cpToday(),n=new Date(),h=n.getHours()+n.getMinutes()/60,dow=n.getDay(),wk=isoWeek(n);
  const k=D.kal,w=D.woche;
  if(h>=5&&h<11&&!c.morning)return{kind:'morning'};
  if(k){const up=k.today.filter(e=>!e.allDay&&e.tStart&&minsUntil(e.tStart)>0&&minsUntil(e.tStart)<=90);if(up.length)return{kind:'soon',e:up[0],m:minsUntil(up[0].tStart)}}
  const weekTime=(dow===5&&h>=14)||((dow===6||dow===0)&&h>=10);
  if(h>=17.5&&!c.evening)return{kind:'evening'};
  if(weekTime&&c.week!==wk&&(c.evening||h<17.5))return{kind:'week'};
  return{kind:'task'};
}
function companionCard(){
  const st=companionState(),w=D.woche,k=D.kal,c=cp();
  if(st.kind==='morning'){
    const ev=k?k.today:[],first=ev.find(e=>!e.allDay&&e.tStart);
    const open=w?w.open.length:0,f=c.focus&&c.focus.d===ymd(new Date())?c.focus.text:'';
    return{lab:'Guten Morgen · dein Tag',t:(ev.length?ev.length+(ev.length===1?' Termin':' Termine')+(first?', erster '+first.tStart:''):'Keine Termine')+' · '+open+(open===1?' Aufgabe':' Aufgaben'),
      s:f?'Heute wichtig: '+f:'Tag in Ruhe planen',act:'morning'}}
  if(st.kind==='soon'){let fit=null;try{fit=dayPlan().now.find(u=>estMin(u.kind==='s'?'S':u.size)<=Math.max(5,st.m-5))}catch(_){}
    return{lab:'Gleich',t:st.e.title+' um '+st.e.tStart+' (in '+st.m+' Min)',s:fit?'Bis dahin passt: '+fit.text+' · '+estLabel(fit.kind==='s'?'S':fit.size):(st.e.loc?'Ort: '+st.e.loc:'Zeit zum Durchatmen'),act:fit?'start':'cal'}}
  if(st.kind==='evening'){const d=w?(w.doneList||[]).length:0,o=w?w.open.length:0;
    return{lab:'Tagesrückblick',t:d+' erledigt · '+o+' offen',s:'Tag abschließen, morgen vorbereiten',act:'evening'}}
  if(st.kind==='week')return{lab:'Wochenrückblick',t:'Zeit für einen ehrlichen Blick auf die Woche',s:'Erledigt · Liegen geblieben · Warte auf · Top 3',act:'week'};
  return null;
}
function companionText(){ /* Texte für die Benachrichtigungen (Android) */
  const k=D.kal,tm=wxDay(1),c=cp(),tom=tomorrowYmd();
  const ev=k?k.tomorrow.filter(e=>!e.allDay&&e.tStart):[];
  let m=ev.length?ev.length+(ev.length===1?' Termin':' Termine')+', der erste um '+ev[0].tStart+'.':'Heute stehen keine Termine an.';
  if(tm){m+=' '+tm.mn+' bis '+tm.mx+'°'+(tm.rain>=55?', Schirm einpacken':'')+(tm.mn<=1?', Glätte möglich':'')+'.'}
  if(c.focus&&c.focus.d===tom)m+=' Wichtig: '+c.focus.text+'.';
  const d=D.woche?(D.woche.doneList||[]).length:0,o=D.woche?D.woche.open.length:0;
  const e=(d?d+(d===1?' Sache':' Dinge')+' geschafft':'Der Tag ist fast vorbei')+(o?', '+o+' offen':'')+'. Fünf Minuten für deinen Rückblick?';
  return{m,e};
}
let cpSig='';
function companionSync(){
  logDay();
  if(!(P&&P.Native&&P.Native.companion)||!D.woche)return;

/* ---------- Woche ---------- */
function openWeek(){
  const n=new Date(),mon=new Date(n);mon.setDate(n.getDate()-((n.getDay()+6)%7));mon.setHours(0,0,0,0);
  const log=jget(DL_KEY,{}),done=[];Object.keys(log).sort().forEach(d=>{if(new Date(d+'T12:00:00')>=mon)log[d].forEach(t=>done.push(t))});
  const w=D.woche,open=w?w.open:[],stuck=open.filter(x=>daysSince(x.since)>=7).sort((a,b)=>daysSince(b.since)-daysSince(a.since));
  let waiting=jget(WT_KEY,[]);
  const jr=jget(JR_KEY,{days:[]}),moods=(jr.days||[]).filter(x=>new Date(x.d+'T12:00:00')>=mon&&x.mood);
  let h='<div class="h-mid" style="margin:0 4px 2px">Wochenrückblick</div><p class="kdp">Ehrlich, ohne Urteil. Fünf kurze Schritte.</p>';
  h+='<div class="lbl">1 · Erledigt</div><div class="cpbox">'+(done.length?'<b>'+done.length+(done.length===1?' Sache':' Dinge')+' diese Woche – das zählt.</b>'+done.slice(-12).map(t=>'<div>✓ '+esc(t)+'</div>').join('')+(done.length>12?'<div><small>… und '+(done.length-12)+' weitere</small></div>':''):'Diese Woche ist noch nichts festgehalten. Ab jetzt merke ich mir jeden erledigten Punkt.')+(moods.length?'<div><small>Stimmung im Schnitt: '+MOODS[Math.round(moods.reduce((a,b)=>a+b.mood,0)/moods.length)-1]+'</small></div>':'')+'</div>';
  h+='<div class="lbl">2 · Liegen geblieben</div><div class="cpbox">'+(stuck.length?stuck.map(x=>{const ds=daysSince(x.since);return '<div>· '+esc(x.text)+' <small>(seit '+ds+' Tagen)</small>'+(ds>=21?'<br><em>Diese Aufgabe steht seit '+Math.floor(ds/7)+' Wochen auf deiner Liste. Erledige sie, delegiere sie oder streiche sie.</em>':'')+'</div>'}).join(''):'Nichts hängt länger als eine Woche. Sauber!')+'</div>';
  h+='<div class="lbl">3 · Warte auf</div><div class="cpbox" id="cpWait"></div><div class="spa"><input class="field" id="cpWI" placeholder="z. B. Rückmeldung von Patrick zur 9a"><button class="d-btn" id="cpWA">+</button></div>';
  h+='<div class="lbl">4 · Nächste Woche – Top 3</div>'+[1,2,3].map(i=>'<input class="field cptop3" placeholder="Priorität '+i+'">').join('');
  h+='<div class="lbl">5 · Erfassen</div><textarea class="field kdt" id="cpCap" rows="3" placeholder="Alles, was dir noch im Kopf herumschwirrt – eine Sache pro Zeile."></textarea>';
  if(open.length>12)h+='<p class="kdp"><b>Ehrlich gesagt:</b> '+open.length+' offene Aufgaben sind zu viel für eine Woche. Streiche oder verschiebe, was nicht wirklich zählt.</p>';
  h+='<button class="d-btn primary" id="cpWk" style="width:100%;margin-top:12px">Woche abschließen</button>';
  openSheet(h);sheet.classList.add('tall');
  const drawW=()=>{$('cpWait').innerHTML=waiting.filter(x=>!x.done).length?waiting.filter(x=>!x.done).map(x=>'<div class="cpw"><span>'+esc(x.text)+' <small>seit '+daysSince(x.since)+' T.</small>'+(daysSince(x.since)>=7?' <em>· nachfassen?</em>':'')+'</span><button data-wd="'+x.id+'">erledigt</button></div>').join(''):'<small>Du wartest gerade auf niemanden.</small>'};
  drawW();
  $('cpWait').onclick=e=>{const b=e.target.closest('[data-wd]');if(!b)return;const x=waiting.find(y=>y.id===b.dataset.wd);if(x)x.done=true;jset(WT_KEY,waiting);drawW()};

  $('cpWk').onclick=()=>{const nm=new Date(mon);nm.setDate(mon.getDate()+7);const top=[...sheet.querySelectorAll('.cptop3')].map(x=>x.value.trim()).filter(Boolean);

    const list=top.map(t=>({text:t,size:guessSize(t),date:ymd(nm)})).concat(cap.map(t=>({text:t,size:guessSize(t),date:null})));
    if(list.length)try{P.call('woche','addTasks',list)}catch(_){}
    if(top.length)setTimeout(()=>{try{const st=JSON.parse(localStorage.getItem('wochenstapel'));for(const t of st.tasks)if(t.date===ymd(nm)&&top.includes(t.text)&&!t.prio)P.call('woche','togglePrio',t.id)}catch(_){}},400);
    const j=jget(JR_KEY,{days:[],weeks:[]}),wk=isoWeek(n);j.weeks=(j.weeks||[]).filter(x=>x.id!==wk);j.weeks.push({id:wk,wk,done:done.length,stuck:stuck.length,top3:top,at:Date.now()});j.weeks=j.weeks.slice(-30);jset(JR_KEY,j);
    const c2=cp();c2.week=wk;cpSet(c2);closeSheet();toast(top.length?'Woche abgeschlossen – Top 3 stehen für Montag bereit':'Woche abgeschlossen. Schönes Wochenende!');D.woche=undefined;load()};
}

  $('epW').textContent=two(n.getHours())+':'+two(n.getMinutes());
  const ev=epNextEvent();
  $('epE').innerHTML=ev?'<b>'+esc(ev.e.title)+'</b><span>'+ev.day+' · '+(ev.e.allDay||!ev.e.tStart?'ganztägig':ev.e.tStart+(ev.e.tEnd?'–'+ev.e.tEnd:''))+(ev.e.loc?' · '+esc(ev.e.loc):'')+'</span>':'<b>Keine Termine</b><span>Heute und morgen ist der Kalender frei</span>';
  let nx=null;try{nx=dayPlan().now[0]}catch(_){}
  const f=fState();
  let cc=null;try{cc=f?null:companionCard()}catch(_){}
  $('epA').dataset.act=cc?cc.act:'';
  if(cc)$('epA').innerHTML='<small>'+esc(cc.lab)+'</small><b>'+esc(cc.t)+'</b><span>'+esc(cc.s)+'</span>';
  else $('epA').innerHTML=f?'<small>Fokus läuft</small><b>'+esc(f.title)+'</b>':nx?'<small>Nächste Aufgabe</small><b>'+esc(nx.text)+'</b><span>'+(nx.kind==='s'?'S':nx.size)+' · '+estLabel(nx.kind==='s'?'S':nx.size)+' · ▶ starten</span>':'<small>Nächste Aufgabe</small><b>Nichts offen</b><span>Gönn dir eine Pause</span>';
  $('epA').classList.toggle('hidden',!cc&&!f&&!nx&&!D.woche);
  const code=cur?cur.weather_code:2,night=cur?!cur.is_day:false;
  requestAnimationFrame(()=>{const c=$('epC');c.style.display='';epFit();if(c.clientHeight<60){c.style.display='none';epFit()}if(c.style.display!=='none')epScene(c,code,night);epSky($('epS'),code,night)});
}
/* Startbildschirm passgenau: Stufenweise verdichten, bis nichts mehr überläuft */
function epFit(){const el=$('ep');if(!el||!epVisible)return;
  el.classList.remove('f1','f2','f3','f4','f5');
  for(const c of ['f1','f2','f3','f4','f5']){if(el.scrollHeight<=el.clientHeight+1)break;el.classList.add(c)}}
addEventListener('resize',()=>setTimeout(epFit,50));
function epShow(){
  if(!isHM()||!EP_ON()){epHide();return}
  epVisible=true;document.body.classList.add('epon');try{P.setEpaper&&P.setEpaper(true)}catch(_){}epRender();
}
function epHide(){
  if(!epVisible&&!document.body.classList.contains('epon'))return false;
  epVisible=false;document.body.classList.remove('epon');try{P.setEpaper&&P.setEpaper(false)}catch(_){}return true;
}
let epLp=false,epT=null,epX=0,epY=0;
$('epF').addEventListener('touchstart',e=>{const b=e.target.closest('[data-app]');epLp=false;if(!b)return;epX=e.touches[0].clientX;epY=e.touches[0].clientY;epT=setTimeout(()=>{epLp=true;try{P.Native.haptic()}catch(_){}L().menu(b.dataset.app)},480)},{passive:true});
$('epF').addEventListener('touchmove',e=>{if(epT&&(Math.abs(e.touches[0].clientX-epX)>10||Math.abs(e.touches[0].clientY-epY)>10)){clearTimeout(epT);epT=null}},{passive:true});
$('epF').addEventListener('touchend',()=>{clearTimeout(epT);epT=null},{passive:true});
$('epF').addEventListener('contextmenu',e=>{const b=e.target.closest('[data-app]');if(b){e.preventDefault();if(!epLp)L().menu(b.dataset.app)}});
window.epShow=epShow;window.epHide=epHide;window.epIsOn=()=>epVisible;window.wordsTime=wordsTime;window.epRender=epRender;
$('ep').addEventListener('click',e=>{
  if(epLp){epLp=false;return}
  const fa=e.target.closest('#epF [data-app]');if(fa){try{L().launch(fa.dataset.app)}catch(_){}return}
  if(e.target.closest('#epF [data-all]')){try{L().openDrawer()}catch(_){}return}
  if(e.target.closest('#epSet')||e.target.closest('#epSet2')){$('bMenu').click();return}
  if(e.target.closest('#epWx')){try{P.showTab('wetter')}catch(_){}return}
  if(e.target.closest('#epDt')){try{P.showTab('kalender')}catch(_){}return}
  if(e.target.closest('#epFc')){try{P.showTab('wetter')}catch(_){}return}
  const q=e.target.closest('[data-q]');if(q){try{P.Native&&P.Native.haptic()}catch(_){}
    if(q.dataset.q==='grad'){const u='https://ratpoison-de.github.io/pags-app/graduierung/lehrer.html';try{if(P.Native&&P.Native.openUrl)P.Native.openUrl(u);else window.open(u,'_blank')}catch(_){window.open(u,'_blank')}}
    else{let k=null;try{k=L()&&L().find(/sekret/i)}catch(_){}if(k)L().launch(k);else toast('Die App „Sekretär“ ist auf diesem Gerät nicht installiert')}
    return}
  if(e.target.closest('[data-epapps]')){try{P.Launcher.openDrawer()}catch(_){}return}
  if(e.target.closest('[data-epassist]')){epHide();try{P.Native&&P.Native.haptic()}catch(_){}return}
  if(e.target.closest('#epE')){epHide();try{P.showTab('kalender')}catch(_){}return}
  if(e.target.closest('#epA')&&$('epA').dataset.act){companionOpen($('epA').dataset.act);return}
  if(e.target.closest('#epA')){if(fState()){try{P.Fokus.open()}catch(_){}}else startNext();return}
  if(e.target.closest('#epB')||e.target.closest('#epW')){try{P.Launcher.openClock()}catch(_){}return}
});
addEventListener('resize',()=>{if(epVisible)epRender()});

/* ================= Startbildschirm (Launcher) ================= */
function L(){try{return P&&P.Launcher&&P.Launcher.on?P.Launcher:null}catch(e){return null}}
let homeMode=false;
const two=n=>String(n).padStart(2,'0');
function lclock(){const n=new Date();$('lclock').textContent=two(n.getHours())+':'+two(n.getMinutes());if(epVisible)epRender()}
(function tickL(){lclock();setTimeout(tickL,60500-Date.now()%60000)})();
function favsHTML(){
  const f=L()?L().favs():[];
  return (f.length?'<div class="lzL">'+f.map(x=>'<button class="lzA" data-app="'+esc(x.k)+'">'+esc(x.name)+'</button>').join('')+'</div>'
    :'<div class="slempty">Lange auf eine App in „Alle Apps“ tippen → Favorit</div>')+'<button class="lzAll" data-all>Alle Apps ›</button>';
}
function launcherUI(){
  const l=L();let on=false;try{on=!!(l&&l.isHome())}catch(e){}
  const first=on&&!homeMode&&!window.__epInit;homeMode=on;document.body.classList.toggle('home',on);
  if(on&&EP_ON())setTimeout(epShow,0);if(!on)epHide();
  $('lclock').classList.toggle('hidden',!on);$('favs').classList.toggle('hidden',!on);
  if(on){lclock();$('favs').innerHTML=favsHTML()}
  fit();
}
window.onLauncher=launcherUI;
$('lclock').onclick=()=>{L()&&L().openClock()};
let lpT=null,lpFired=false,lpX=0,lpY=0;
$('favs').addEventListener('touchstart',e=>{const b=e.target.closest('[data-app]');lpFired=false;if(!b)return;lpX=e.touches[0].clientX;lpY=e.touches[0].clientY;lpT=setTimeout(()=>{lpFired=true;try{P.Native.haptic()}catch(_){}L().menu(b.dataset.app)},480)},{passive:true});
$('favs').addEventListener('touchmove',e=>{if(lpT&&(Math.abs(e.touches[0].clientX-lpX)>10||Math.abs(e.touches[0].clientY-lpY)>10)){clearTimeout(lpT);lpT=null}},{passive:true});
$('favs').addEventListener('touchend',()=>{clearTimeout(lpT);lpT=null},{passive:true});
$('favs').addEventListener('contextmenu',e=>{const b=e.target.closest('[data-app]');if(b){e.preventDefault();if(!lpFired)L().menu(b.dataset.app)}});
$('favs').addEventListener('click',e=>{
  if(lpFired){lpFired=false;return}
  if(e.target.closest('[data-all]')){L().openDrawer();return}
  const b=e.target.closest('[data-app]');if(b)L().launch(b.dataset.app);
});
/* Gesten wie bei Olauncher: am Seitenende nach oben wischen → Alle Apps, doppelt tippen → sperren */
let gx=0,gy=0,gBottom=false,lastTap=0;
const atBottom=()=>scrollY+innerHeight>=document.documentElement.scrollHeight-4;
document.addEventListener('touchstart',e=>{if(!homeMode)return;gx=e.touches[0].clientX;gy=e.touches[0].clientY;gBottom=atBottom()},{passive:true});
document.addEventListener('touchend',e=>{
  if(!homeMode||sheet.classList.contains('on'))return;
  const t=e.changedTouches[0],dx=t.clientX-gx,dy=t.clientY-gy;
  if(dy<-80&&Math.abs(dy)>Math.abs(dx)*1.4&&gBottom){L().openDrawer();return}
  if(Math.abs(dx)<12&&Math.abs(dy)<12&&!e.target.closest('button,a,input,textarea,select,label,form,[data-go],[data-sec],[data-app],.tcard,.gl,.task')){
    const now=Date.now();if(now-lastTap<320){lastTap=0;L().lock()}else lastTap=now;
  }else lastTap=0;
},{passive:true});

clock();startClock();
launcherUI();
window.ready=Promise.resolve();
render();
})();
</script>
</body>
</html>
